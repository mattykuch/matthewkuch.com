project:
  type: website
  # Build output is an Actions artifact, so _site/ is gitignored and NEVER committed.
  output-dir: _site
  render:
    - "index.qmd"
    - "about.qmd"
    - "blog.qmd"
    - "projects.qmd"
    - "books.qmd"
    - "cv.qmd"
    - "posts/*/index.qmd"
    # README.md / CLAUDE.md are deliberately not rendered
  resources:
    - "CNAME"
    - "assets/**"
    - "lab/**"          # standalone analysis — keeps /lab/displacement-effect/ alive
    - ".nojekyll"

website:
  title: "Matthew Kuch"
  site-url: "https://matthewkuch.com"     # drives sitemap.xml, robots.txt, absolute social URLs
  description: "Writing on health financing, global health, political economy, data visualisation and supply chains, by management consultant Matthew Kuch."
  image: assets/matthew-kuch.png
  favicon: assets/favicon.svg
  open-graph: true
  twitter-card:
    creator: "@matthewkuch"
    site: "@matthewkuch"
    card-style: summary_large_image
  search:
    location: navbar
    type: overlay
  navbar:
    background: light
    title: "Matthew Kuch"
    pinned: true
    left:
      - text: "Home"
        href: index.qmd
      - text: "About"
        href: about.qmd
      - text: "Blog"
        href: blog.qmd
      - text: "Projects"
        href: projects.qmd
      - text: "Books"
        href: books.qmd
      - text: "CV"
        href: cv.qmd
    right:
      - icon: rss
        href: blog.xml
        aria-label: RSS feed
      - icon: linkedin
        href: https://www.linkedin.com/in/matthew-k-ab0134122/
        aria-label: LinkedIn
      - icon: github
        href: https://github.com/mattykuch
        aria-label: GitHub
      - icon: envelope
        href: "mailto:kuch.matthew@gmail.com"
        aria-label: Email
  page-footer:
    border: true
    left: "© 2026 Matthew Kuch"
    right:
      - text: "About"
        href: about.qmd
      - text: "RSS"
        href: blog.xml

format:
  html:
    theme:
      - cosmo
      - theme/brand.scss
    toc: true
    toc-depth: 3
    canonical-url: true
    code-copy: false
    code-overflow: wrap
    code-tools: false
    anchor-sections: true
    smooth-scroll: true
    html-math-method: katex
    link-external-newwindow: true
    link-external-icon: true

filters:
  - jsonld.lua

execute:
  freeze: auto
